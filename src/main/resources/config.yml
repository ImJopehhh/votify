# Votify Configuration

# The name of your server, used in some messages.
server-name: "My Awesome Server"

# Enable or disable debug messages in the console.
debug: false

# Login Delay (in seconds)
# Time to wait after a player joins before giving pending rewards.
login-delay: 5

# Discord Webhook Configuration
discord:
  # Webhook for vote notifications (sent every time someone votes)
  vote-webhook:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/..."

  # Webhook for monthly top voter announcement
  top-voter-webhook:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/..."

  # Embed settings for each vote notification
  vote-embed:
    title: "New Vote Received!"
    description: "**%player%** has just voted on **%service%**! Thank you for supporting the server."
    color: 5763719  # Green (#57F287)
    footer-text: "Votify System"
    footer-icon-url: ""
    thumbnail-url: "https://mc-heads.net/avatar/%player%/128"
    timestamp: true

  # Embed settings for monthly top voter announcement
  top-voter-embed:
    title: "🏆 Monthly Top Voters"
    description: "Here are the top voters for **%month%**! Thank you all for your support."
    color: 16766720  # Gold (#FFD700)
    footer-text: "Votify System"
    footer-icon-url: ""
    thumbnail-url: ""
    image-url: ""

  # Template for each player entry in the top voter list
  # Available placeholders: %rank%, %player%, %votes%
  top-voter-entry-format: "%rank%. **%player%** — %votes% votes"

# System Data (Do not edit manually)
data:
  last-month: -1
  last-week: -1

# Messages
messages:
  prefix: "&8[&bVotify&8] &r"
  # Message sent to the player who voted (if online)
  vote-received: "&aThanks, &e%player%&a, for voting on &e%service%&a!"
  # Message sent to the whole server (Global Broadcast)
  # Leave empty "" to disable.
  broadcast: "&b%player% &7just voted on &e%service%&7and received a reward!"
  
  player-not-found: "%prefix% &cPlayer %player% not found."
  no-permission: "%prefix% &cYou don't have permission to use this command."
  reload: "%prefix% &aConfiguration reloaded successfully."

  # Vote Party Messages
  voteparty:
    progress: "%prefix% &d&lVOTE PARTY! &7Another vote has been counted! &8(&e%current_votes%&7/&6%required_votes%&8)"
    reached:
      - "&d&lVOTE PARTY!"
      - "&7The vote goal has been reached! Everyone online receives a reward!"
      - ""
